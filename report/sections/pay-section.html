  <section id="pay-section">
    <div class="section-head">
      <h2 id="pay-heading">Pay growth, indexed to first stable month</h2>
      <p class="section-sub">Median annualized pay per plan, indexed so both tracks share one axis. Ticks mark the January adjustment boundary each year.</p>
    </div>
    <div class="two-col">
      <div class="chart-card">
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--accent-dc)"></span>DC median</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--accent-dl)"></span>DL median</span>
        </div>
        <div class="chart-wrap" id="pay-wrap">
          <svg id="pay-svg" viewBox="0 0 620 340" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="tooltip" id="pay-tooltip"></div>
        </div>
        <div class="chart-foot" id="pay-baseline-foot"></div>
      </div>
      <div class="chart-card" style="display:flex; flex-direction:column; justify-content:center; gap:18px;">
        <div>
          <div class="stat-label" style="margin-bottom:4px;">DC median, actual dollars</div>
          <div class="stat-value" id="dc-dollar-move" style="font-size:22px;"></div>
        </div>
        <div>
          <div class="stat-label" style="margin-bottom:4px;">DL median, actual dollars</div>
          <div class="stat-value" id="dl-dollar-move" style="font-size:22px;"></div>
        </div>
        <div style="border-top:1px solid var(--border); padding-top:14px;">
          <div class="stat-label" id="jan-boundary-label"></div>
          <div id="jan-boundaries" style="margin-top:8px; display:flex; flex-direction:column; gap:8px;"></div>
        </div>
      </div>
    </div>
  </section>
