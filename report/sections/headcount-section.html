  <section id="headcount-section">
    <div class="section-head">
      <h2 id="headcount-heading">Headcount since inception</h2>
      <p class="section-sub">Monthly population by pay plan. DC is the standard CTMS track; DL is the senior-leader track.</p>
    </div>
    <div class="chart-card">
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch" style="background:var(--accent-dc)"></span>DC</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--accent-dl)"></span>DL</span>
      </div>
      <div class="chart-wrap" id="headcount-wrap">
        <svg id="headcount-svg" viewBox="0 0 920 360" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="tooltip" id="headcount-tooltip"></div>
      </div>
      <div class="chart-foot" id="headcount-foot"></div>
    </div>
  </section>
