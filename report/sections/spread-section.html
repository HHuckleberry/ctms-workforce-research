  <section id="spread-section">
    <div class="section-head">
      <h2>Pay spread within each plan</h2>
      <p class="section-sub">The median hides how much variation sits inside DC and DL. Shaded band is the 25th&ndash;75th percentile; thin lines mark the 10th/90th. Both charts use the same size and salary scale.</p>
    </div>
    <div class="two-col equal-cols">
      <div class="chart-card">
        <div class="section-head" style="margin-bottom:12px;"><h2 style="font-size:15px;">DC</h2></div>
        <div class="chart-wrap" id="spread-dc-wrap">
          <svg id="spread-dc-svg" viewBox="0 0 460 220" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="tooltip" id="spread-dc-tooltip"></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="section-head" style="margin-bottom:12px;"><h2 style="font-size:15px;">DL</h2></div>
        <div class="chart-wrap" id="spread-dl-wrap">
          <svg id="spread-dl-svg" viewBox="0 0 460 220" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="tooltip" id="spread-dl-tooltip"></div>
        </div>
      </div>
    </div>
    <div class="chart-foot" id="spread-foot" style="margin-top:8px;"></div>
  </section>
